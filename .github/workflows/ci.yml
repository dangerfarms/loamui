name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
        env:
          PAGES: "true"
      - run: pnpm check:skill
      - run: pnpm -r lint
      - run: pnpm lint:md
      - run: pnpm format:check
      - run: pnpm --filter @loamui/core exec tsc --noEmit
      - run: pnpm --filter @loamui/ui exec tsc --noEmit
      - run: npx tsc --noEmit
        working-directory: apps/docs
      - run: npx tsc --noEmit
        working-directory: apps/ui
      - run: pnpm --filter @loamui/core audit:contrast
      - run: pnpm --filter @loamui/core test
